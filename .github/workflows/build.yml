name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Xposed stub JAR
        run: |
          mkdir -p app/libs
          python3 << 'PYEOF'
          import os, subprocess

          base = "/tmp/xstub"
          files = {
            "de/robv/android/xposed/callbacks/XC_LoadPackage.java": """
package de.robv.android.xposed.callbacks;
public class XC_LoadPackage {
    public static class LoadPackageParam {
        public String packageName;
        public String processName;
        public ClassLoader classLoader;
        public boolean isFirstApplication;
    }
}""",
            "de/robv/android/xposed/XC_MethodHook.java": """
package de.robv.android.xposed;
public abstract class XC_MethodHook {
    public void beforeHookedMethod(MethodHookParam param) throws Throwable {}
    public void afterHookedMethod(MethodHookParam param) throws Throwable {}
    public class MethodHookParam {
        public java.lang.reflect.Member method;
        public Object thisObject;
        public Object[] args;
        private Object result;
        private Throwable throwable;
        public Object getResult() { return result; }
        public void setResult(Object result) { this.result = result; }
        public Throwable getThrowable() { return throwable; }
        public boolean hasThrowable() { return throwable != null; }
    }
}""",
            "de/robv/android/xposed/XposedBridge.java": """
package de.robv.android.xposed;
public class XposedBridge {
    public static void log(String text) {}
    public static void log(Throwable t) {}
    public static Object invokeOriginalMethod(java.lang.reflect.Member method,
        Object thisObject, Object[] args) throws Throwable { return null; }
}""",
            "de/robv/android/xposed/XposedHelpers.java": """
package de.robv.android.xposed;
public class XposedHelpers {
    public static Object findAndHookMethod(String className, ClassLoader cl,
        String methodName, Object... args) { return null; }
    public static Object findAndHookMethod(Class<?> clazz,
        String methodName, Object... args) { return null; }
    public static Object getObjectField(Object obj, String fieldName) { return null; }
    public static void setObjectField(Object obj, String fieldName, Object value) {}
    public static int getIntField(Object obj, String fieldName) { return 0; }
    public static void setIntField(Object obj, String fieldName, int value) {}
    public static boolean getBooleanField(Object obj, String fieldName) { return false; }
    public static void setBooleanField(Object obj, String fieldName, boolean value) {}
    public static Object callMethod(Object obj, String methodName, Object... args) { return null; }
    public static Object callStaticMethod(Class<?> clazz, String methodName, Object... args) { return null; }
    public static Class<?> findClass(String className, ClassLoader classLoader) { return null; }
}""",
            "de/robv/android/xposed/IXposedHookLoadPackage.java": """
package de.robv.android.xposed;
import de.robv.android.xposed.callbacks.XC_LoadPackage;
public interface IXposedHookLoadPackage {
    void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
}"""
          }

          for path, content in files.items():
              full = os.path.join(base, path)
              os.makedirs(os.path.dirname(full), exist_ok=True)
              open(full, "w").write(content)
              print(f"Wrote {full}")

          srcs = [os.path.join(base, f) for f in files.keys()]
          r = subprocess.run(["javac", "-source", "8", "-target", "8"] + srcs,
              capture_output=True, text=True)
          print(r.stdout); print(r.stderr)

          ws = os.environ.get("GITHUB_WORKSPACE", ".")
          out = os.path.join(ws, "app/libs/XposedBridgeApi.jar")
          r2 = subprocess.run(["jar", "cf", out, "-C", base, "."],
              capture_output=True, text=True)
          print(r2.stdout); print(r2.stderr)
          print(f"JAR size: {os.path.getsize(out)} bytes")
          PYEOF

      - name: Download IjkPlayer
        run: |
          curl -fL \
            "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-java/0.8.8/ijkplayer-java-0.8.8.jar" \
            -o app/libs/ijkplayer-java.jar
          echo "IjkJava: $(wc -c < app/libs/ijkplayer-java.jar) bytes"

          curl -fL \
            "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-arm64/0.8.8/ijkplayer-arm64-0.8.8.aar" \
            -o app/libs/ijkplayer-arm64.aar
          echo "IjkArm64: $(wc -c < app/libs/ijkplayer-arm64.aar) bytes"

          ls -lh app/libs/

      - name: Create debug keystore
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
