name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Xposed stub JAR
        run: |
          mkdir -p app/libs
          python3 .github/scripts/build_xposed_stub.py

      - name: Build IjkPlayer stub JAR
        run: |
          mkdir -p app/libs
          python3 .github/scripts/build_ijk_stub.py

      - name: Create debug keystore
        run: |
          mkdir -p keystore
          keytool -genkey -v -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon 2>&1 | grep -E "^e:|error:|Unresolved|cannot find|FAILED|\.kt:" | head -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
