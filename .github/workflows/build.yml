name: Build VCamera

on:
  push:
    branches: [ main, master, VCameraRevived2, axiom-fix ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26d
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264" --sdk_root=$ANDROID_SDK_ROOT
          echo "NDK installed at: $ANDROID_SDK_ROOT/ndk/26.3.11579264"

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L \
            "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VCamera-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
