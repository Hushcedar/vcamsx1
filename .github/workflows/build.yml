name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Download local JARs
        run: |
          mkdir -p app/libs

          # Xposed API — correct working URL via Maven
          curl -fL \
            "https://repo1.maven.org/maven2/de/robv/android/xposed/api/82/api-82.jar" \
            -o app/libs/XposedBridgeApi.jar || \
          curl -fL \
            "https://maven.pkg.github.com/rovo89/XposedBridge/de/robv/android/xposed/api/82/api-82.jar" \
            -o app/libs/XposedBridgeApi.jar || \
          curl -fL \
            "https://jitpack.io/de/robv/android/xposed/api/82/api-82.jar" \
            -o app/libs/XposedBridgeApi.jar

          echo "Xposed: $(wc -c < app/libs/XposedBridgeApi.jar) bytes"

          # IjkPlayer java JAR
          curl -fL \
            "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-java/0.8.8/ijkplayer-java-0.8.8.jar" \
            -o app/libs/ijkplayer-java.jar
          echo "IjkJava: $(wc -c < app/libs/ijkplayer-java.jar) bytes"

          # IjkPlayer arm64 AAR
          curl -fL \
            "https://repo1.maven.org/maven2/tv/danmaku/ijk/media/ijkplayer-arm64/0.8.8/ijkplayer-arm64-0.8.8.aar" \
            -o app/libs/ijkplayer-arm64.aar
          echo "IjkArm64: $(wc -c < app/libs/ijkplayer-arm64.aar) bytes"

          ls -lh app/libs/

      - name: Verify JARs
        run: |
          for f in app/libs/*.jar app/libs/*.aar; do
            size=$(wc -c < "$f")
            echo "$f = $size bytes"
            if [ "$size" -lt 1000 ]; then
              echo "FAILED: $f too small"
              cat "$f"
              exit 1
            fi
          done
          echo "All JARs OK"

      - name: Create debug keystore
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VCam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
