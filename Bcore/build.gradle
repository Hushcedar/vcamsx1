apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk 35

    buildFeatures {
        aidl true
        prefab true
        buildConfig true
    }

    defaultConfig {
        minSdk 24
        versionCode 1
        versionName "3.5.0"
        consumerProguardFiles "consumer-rules.pro"/*

        externalNativeBuild {
            ndkBuild {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }*/
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false }
    }

    // ndkVersion "26.3.11579264"/*

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }*/

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", "RestrictedApi"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
}
