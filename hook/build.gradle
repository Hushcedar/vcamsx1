plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace         rootProject.ext.package_name + '.hook'
    compileSdk        rootProject.ext.compile_sdk

    defaultConfig {
        minSdk      rootProject.ext.min_sdk
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // LSPlant — in-process ART hook engine (replaces Xposed for no-root) ──────
    // BlackBox injects this into the cloned app process; we use the Java API.
    implementation 'org.lsposed.lsplant:lsplant:6.1'

    // Xposed API stubs — compile-only so our hook module can reference
    // XC_MethodHook, XposedHelpers etc. BlackBox/BXposed provides the runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
