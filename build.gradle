plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'com.android.library'     version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

ext {
    // App config
    package_name        = 'com.axiom.vcam'
    min_sdk             = 28
    compile_sdk         = 34
    target_sdk          = 34
    version_code        = 1
    version_name        = '1.0.0'
    kotlin_version      = '1.9.22'
    compose_compiler    = '1.5.8'

    // MultiApp/WaxMoon engine config
    minSdkVersion       = 28
    compileSdkVersion   = 34
    targetSdkVersion    = 34
    buildToolsVersion   = "34.0.0"
    javaVersion         = JavaVersion.VERSION_17
    abiFilters          = "armeabi-v7a,arm64-v8a"
    localTest           = false
    isMasterPkg         = true
    hackJarName         = "moon.jar"
    versionCode         = 1
    versionName         = "1.0.0"
    masterPkg           = "com.axiom.vcam"
    assistPkg           = "com.axiom.vcam.assist"
}
