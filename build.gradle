buildscript {
    ext.kotlin_version = "2.0.20"
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.7.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    minSdkVersion     = 28          // Android 9 — covers 99 %+ of active devices in 2026
    compileSdkVersion = 35          // Android 15 SDK
    targetSdkVersion  = 35          // Target API 35 (Play Store requirement from Aug 2025)
    buildToolsVersion = "35.0.0"
    javaVersion       = JavaVersion.VERSION_17
    abiFilters        = "armeabi-v7a,arm64-v8a"
    localTest         = false
    isMasterPkg       = true
    hackJarName       = "hack.jar"  // canonical name; moon.jar is identical but unused
    versionCode       = 360
    versionName       = "3.6.0"
    masterPkg         = "virtual.camera.app"
    assistPkg         = "virtual.camera.app.assist"
}
