plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace         rootProject.ext.package_name
    compileSdk        rootProject.ext.compile_sdk

    defaultConfig {
        applicationId   rootProject.ext.package_name
        minSdk          rootProject.ext.min_sdk
        targetSdk       rootProject.ext.target_sdk
        versionCode     rootProject.ext.version_code
        versionName     rootProject.ext.version_name

        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled   false
            signingConfig   signingConfigs.debug
        }
        debug {
            minifyEnabled   false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion rootProject.ext.compose_compiler
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        // BlackBox ships its own libc++_shared — keep one copy
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libdexjni.so'
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ── Compose ──────────────────────────────────────────────────────────────
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ── Core AndroidX ────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── BlackBox container (FBlackBox — works Android 9-15) ──────────────────
    // NOTE: If the maven repo AAR is unavailable at build time, download
    // BlackBox-release.aar from https://github.com/FBlackBox/FBlackBox/releases
    // and drop into app/libs/ — the fileTree line below picks it up automatically.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // Primary maven pull:
    implementation 'io.github.fblackbox:blackbox:3.3.6'

    // ── Hook module (sibling module — camera injection logic) ────────────────
    implementation project(':hook')
}
