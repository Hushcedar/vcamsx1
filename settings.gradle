pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // flatDir for app/libs local AARs/JARs
        flatDir { dirs 'app/libs', 'Bcore/libs' }
    }
}
rootProject.name = "VCamera"
include ':app'
include ':Bcore'
